name: SafeTV Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Unit & Security Test Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install System Dependencies (OpenCV)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Reassemble Model Checkpoint
        run: |
          cat models/violence_detector/best_model.pth.part0 models/violence_detector/best_model.pth.part1 > models/violence_detector/best_model.pth
          ls -lh models/violence_detector/best_model.pth

      - name: Run Full SafeTV Test Suite
        run: |
          python -m unittest discover -s tests -v

      - name: Run Model Preprocessing Parity Test
        run: |
          python -m unittest tests/test_preprocessing_parity.py -v

      - name: Run Security and SSRF Prevention Tests
        run: |
          python -m unittest tests/test_security.py -v

      - name: Run Model Integrity and Mutation Tests
        run: |
          python -m unittest tests/test_model_integrity.py -v
